<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Deal Review Agent POC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font: 15px/1.4 system-ui, sans-serif;
      color: #1c1c1c;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding: 10px 20px;
      border-bottom: 1px solid #d5d5d5;
      background: white;
    }
    .header .title { font-size: 17px; font-weight: 600; color: #0033a1; letter-spacing: 0.2px; }
    .header img { height: 32px; display: block; }
    .panes { flex: 1; min-height: 0; display: flex; }
    .pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
    }
    .pane + .pane { border-left: 1px solid #d5d5d5; }
    h1 { margin: 0; font-size: 18px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    input, textarea {
      width: 100%;
      font: inherit;
      padding: 8px;
      border: 1px solid #bdbdbd;
      border-radius: 6px;
    }
    textarea { min-height: 110px; resize: vertical; }
    button.action {
      align-self: flex-start;
      font: inherit;
      padding: 8px 14px;
      border: 0;
      border-radius: 6px;
      background: #0b5fff;
      color: white;
      cursor: pointer;
    }
    button.action:disabled { opacity: 0.6; cursor: wait; }
    button.action.secondary { background: white; color: #0b5fff; border: 1px solid #0b5fff; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .status { min-height: 1.2em; color: #8a1f1f; }
    /* Vertical process flow: a circle per task, joined by a rail that turns green as steps finish. */
    .flow { list-style: none; margin: 0; padding: 6px 2px; flex: 1; min-height: 0; overflow: auto; }
    .step { position: relative; display: flex; gap: 14px; padding-bottom: 22px; }
    .step:last-child { padding-bottom: 0; }
    .step:not(:last-child)::before,
    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 12px;
      top: 28px;
      bottom: 2px;
      width: 2px;
      margin-left: -1px;
      background: #d5d5d5;
    }
    .step:not(:last-child)::after {
      background: #137333;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.6s ease;
    }
    .step.done:not(:last-child)::after,
    .step.error:not(:last-child)::after { transform: scaleY(1); }
    .step.error:not(:last-child)::after { background: #b3261e; }
    .dot {
      position: relative;
      z-index: 1;
      flex: none;
      width: 26px;
      height: 26px;
      border: 2px solid #b8b8b8;
      border-radius: 50%;
      background: white;
      color: white;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      display: grid;
      place-items: center;
      transition: background 0.3s, border-color 0.3s;
    }
    .step.active .dot { border-color: #cfe0ff; border-top-color: #0b5fff; animation: spin 0.9s linear infinite; }
    .step.done .dot { background: #137333; border-color: #137333; animation: pop 0.4s ease; }
    .step.error .dot { background: #b3261e; border-color: #b3261e; animation: pop 0.4s ease; }
    .step.skipped .dot { background: #9a9a9a; border-color: #9a9a9a; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .step-body { flex: 1; min-width: 0; padding-top: 2px; }
    .step-title { font-weight: 600; color: #6b6b6b; transition: color 0.3s; }
    .step.active .step-title { color: #0b5fff; }
    .step.done .step-title { color: #1c1c1c; }
    .step.error .step-title { color: #b3261e; }
    .step-note { min-height: 0; font-size: 13px; color: #555; overflow-wrap: anywhere; }
    .step-note:empty { display: none; }
    .subs { margin: 4px 0 0; padding: 0; list-style: none; }
    .sub { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; animation: fade 0.4s ease; }
    .sub::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: #137333; }
    .sub.bad::before { background: #b3261e; }
    .sub.bad { color: #8a1f1f; }
    @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
    button.linkish, a.linkish {
      font: inherit;
      padding: 0;
      border: 0;
      background: none;
      color: #0b5fff;
      cursor: pointer;
      text-align: left;
      text-decoration: underline;
    }
    .step-title button.linkish { font-weight: 600; color: inherit; }
    button.linkish[aria-pressed="true"] { font-weight: 700; }
    @media (prefers-reduced-motion: reduce) {
      .step.active .dot, .step.done .dot, .step.error .dot, .sub { animation: none; }
      .step:not(:last-child)::after { transition: none; }
    }
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      padding: 20px;
      background: rgba(20, 20, 20, 0.55);
    }
    .viewer[hidden] { display: none; }
    .viewer-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    .viewer-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #e4e4e4;
    }
    .viewer-bar h2 {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .viewer-count { color: #555; font-size: 13px; }
    .viewer-body { position: relative; flex: 1; min-height: 0; overflow: auto; background: #fafafa; }
    .viewer-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: white; }
    .viewer-body img { display: block; max-width: 100%; height: auto; margin: 0 auto; background: white; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; background: white; }
    th, td { border: 1px solid #e4e4e4; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #f3f3f3; }
  </style>
</head>

  </header>
  <main class="panes">
  <section class="pane">
    <h1>Purchase acknowledgement</h1>
    <label>Subject <input id="subject" autocomplete="off"></label>
    <label>Body <textarea id="body"></textarea></label>
    <div class="actions">
      <button class="action secondary" id="ack-fill" type="button">Autofill email</button>
      <button class="action" id="ack-button" type="button">Send purchase acknowledgement</button>
    </div>
    <p class="status" id="ack-status"></p>
    <ol class="flow" id="ack-flow" aria-label="Purchase acknowledgement progress"></ol>
  </section>
  <section class="pane">
    <h1>Quote lines</h1>
    <label>Quote number <input id="quote" autocomplete="off" placeholder="Q-123456"></label>
    <button class="action" id="quote-button" type="button">Fetch quote lines</button>
    <p class="status" id="quote-status"></p>
    <ol class="flow" id="quote-flow" aria-label="Quote lines progress"></ol>
  </section>
  </main>
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <div class="viewer-bar">
        <button class="action secondary" id="viewer-prev" type="button">Previous</button>
        <button class="action secondary" id="viewer-next" type="button">Next</button>
        <h2 id="viewer-title"></h2>
        <span class="viewer-count" id="viewer-count"></span>
        <button class="action secondary" id="viewer-close" type="button">Close</button>
      </div>
      <div id="viewer-body" class="viewer-body"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script>
    const API = window.API_BASE || (location.origin.startsWith("http") ? location.origin : "");
    const KINDS = [
      ["purchase_order", "Purchase order"],
      ["fully_executed_quote", "Fully executed quote"],
      ["transaction_approval_form", "Transaction approval form"],
      ["master_agreement", "Master agreement"],
    ];

    function errorText(data) {
      const detail = data && data.detail;
      if (typeof detail === "string") return detail;
      if (detail && typeof detail.error === "string") return detail.error;
      if (Array.isArray(detail)) return detail.map((item) => item.msg || "Invalid request").join("; ");
      return "";
    }

    function payloadOf(data) {
      const detail = data && data.detail;
      if (detail && typeof detail === "object" && !Array.isArray(detail)) return { ...data, ...detail };
      return data || {};
    }

    function showImage(preview, src) {
      const image = document.createElement("img");
      image.src = src;
      image.alt = "Screenshot";
      preview.replaceChildren(image);
    }

    function showFile(preview, path) {
      const url = API + "/files?path=" + encodeURIComponent(path);
      preview.replaceChildren();
      if (/\.(png|jpe?g|webp|gif)$/i.test(path)) {
        const image = document.createElement("img");
        image.src = url;
        image.alt = path;
        preview.append(image);
        return;
      }
      const frame = document.createElement("iframe");
      frame.src = url;
      frame.title = path;
      preview.append(frame);
    }

    function showRecords(preview, records) {
      preview.replaceChildren();
      const rows = records || [];
      if (!rows.length) {
        preview.textContent = "No quote lines were returned.";
        return;
      }
      const keys = Object.keys(rows[0]).filter((key) => key !== "attributes");
      const table = document.createElement("table");
      const head = document.createElement("tr");
      for (const key of keys) {
        const cell = document.createElement("th");
        cell.textContent = key;
        head.append(cell);
      }
      table.append(head);
      for (const row of rows) {
        const line = document.createElement("tr");
        for (const key of keys) {
          const cell = document.createElement("td");
          const value = row[key];
          cell.textContent = value == null ? "" : typeof value === "object" ? JSON.stringify(value) : String(value);
          line.append(cell);
        }
        table.append(line);
      }
      preview.append(table);
    }

    let viewerItems = [];
    let viewerIndex = 0;

    function showViewerItem() {
      const item = viewerItems[viewerIndex];
      const body = document.getElementById("viewer-body");
      document.getElementById("viewer-title").textContent = item.title;
      document.getElementById("viewer-count").textContent = (viewerIndex + 1) + " of " + viewerItems.length;
      document.getElementById("viewer-prev").disabled = viewerIndex === 0;
      document.getElementById("viewer-next").disabled = viewerIndex === viewerItems.length - 1;
      for (const entry of viewerItems) {
        if (entry.button) entry.button.setAttribute("aria-pressed", entry === item ? "true" : "false");
      }
      if (item.image) showImage(body, item.image);
      else if (item.path) showFile(body, item.path);
      else showRecords(body, item.records);
    }

    function openViewer(items, index) {
      viewerItems = items;
      viewerIndex = index;
      showViewerItem();
      const viewer = document.getElementById("viewer");
      viewer.hidden = false;
      document.body.style.overflow = "hidden";
      document.getElementById("viewer-close").focus();
    }

    function closeViewer() {
      const viewer = document.getElementById("viewer");
      if (viewer.hidden) return;
      viewer.hidden = true;
      document.body.style.overflow = "";
      document.getElementById("viewer-body").replaceChildren();
      const current = viewerItems[viewerIndex];
      viewerItems = [];
      if (current && current.button) current.button.focus();
    }

    function stepViewer(delta) {
      const next = viewerIndex + delta;
      if (next < 0 || next >= viewerItems.length) return;
      viewerIndex = next;
      showViewerItem();
    }

    const STATE_MARK = { done: "✓", error: "✕", skipped: "–" };
    const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, REDUCED ? 0 : ms));

    function buildFlow(container, titles) {
      container.replaceChildren();
      return titles.map((title) => {
        const li = document.createElement("li");
        li.className = "step pending";
        const dot = document.createElement("span");
        dot.className = "dot";
        const body = document.createElement("div");
        body.className = "step-body";
        const head = document.createElement("div");
        head.className = "step-title";
        head.textContent = title;
        const note = document.createElement("div");
        note.className = "step-note";
        const subs = document.createElement("ul");
        subs.className = "subs";
        body.append(head, note, subs);
        li.append(dot, body);
        container.append(li);
        return { li, dot, head, note, subs, title };
      });
    }

    function setStep(step, state, note) {
      step.li.className = "step " + state;
      step.dot.textContent = STATE_MARK[state] || "";
      if (note !== undefined) step.note.textContent = note;
    }

    // The server does each flow in one request, so progress while waiting is an estimate:
    // each step is shown as running for roughly delays[i] ms. The reply then sets the real outcome.
    function startProgress(steps, delays) {
      let index = 0;
      let timer = 0;
      setStep(steps[0], "active", "Working…");
      const advance = () => {
        if (index >= steps.length - 1) return;
        setStep(steps[index], "done", "");
        index += 1;
        setStep(steps[index], "active", "Working…");
        if (index < steps.length - 1) timer = setTimeout(advance, delays[index]);
      };
      if (steps.length > 1) timer = setTimeout(advance, delays[0]);
      return () => clearTimeout(timer);
    }

    function linkTo(url, text) {
      if (!/^https:\/\//i.test(url || "")) return null;
      const anchor = document.createElement("a");
      anchor.className = "linkish";
      anchor.href = url;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.textContent = text;
      return anchor;
    }

    // outcomes[i] = { state, note, open, subs: [{ ok, label, open, url }], url, urlText }
    async function settleFlow(steps, outcomes) {
      const openable = [];
      for (let i = 0; i < steps.length; i++) {
        const step = steps[i];
        const outcome = outcomes[i];
        setStep(step, outcome.state, outcome.note || "");
        if (outcome.open) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "linkish";
          button.textContent = step.title;
          step.head.replaceChildren(button);
          openable.push({ open: outcome.open, button });
        }
        step.subs.replaceChildren();
        for (const sub of outcome.subs || []) {
          const item = document.createElement("li");
          item.className = "sub" + (sub.ok ? "" : " bad");
          if (sub.open) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "linkish";
            button.textContent = sub.label;
            item.append(button);
            openable.push({ open: sub.open, button });
          } else {
            item.append(sub.url ? linkTo(sub.url, sub.label) || sub.label : sub.label);
          }
          step.subs.append(item);
        }
        if (outcome.url) {
          const anchor = linkTo(outcome.url, outcome.urlText || "Open in SharePoint");
          if (anchor) {
            const item = document.createElement("li");
            item.className = "sub";
            item.append(anchor);
            step.subs.append(item);
          }
        }
        if (i < steps.length - 1) await sleep(260);
      }
      openable.forEach((entry, index) => {
        entry.button.addEventListener("click", () => {
          openViewer(openable.map((item) => ({ ...item.open(), button: item.button })), index);
        });
      });
    }

    const ACK_STEPS = [
      "Read purchase acknowledgement email",
      "Create Asana task",
      "Retrieve documents from Salesforce",
      "Upload documents to SharePoint",
    ];
    const QUOTE_STEPS = [
      "Fetch quote lines from Salesforce",
      "Capture report screenshot",
      "Update Deal Review Sheet in SharePoint",
    ];
    const ACK_DELAYS = [900, 4000, 12000];
    const QUOTE_DELAYS = [2500, 45000];

    function ackOutcomes(result, payload) {
      const docs = payload.documents || null;
      const failure = errorText(result.data);
      const outcomes = [];
      outcomes.push(
        payload.task_name
          ? { state: "done", note: payload.task_name }
          : { state: "error", note: failure || "Email was not accepted." }
      );
      if (!payload.task_name) {
        outcomes.push({ state: "skipped", note: "Not run" });
      } else if (payload.asana_gid) {
        outcomes.push({
          state: "done",
          note: payload.asana_url ? "Task created" : "",
          url: payload.asana_url,
          urlText: "Open task in Asana",
          open: () => ({
            title: "Asana task " + payload.task_name,
            records: [{
              task_name: payload.task_name,
              description: payload.description,
              delivery_date: payload.delivery_date,
              period: payload.period,
              quote_number: payload.quote_number,
              asana_url: payload.asana_url || "",
            }],
          }),
        });
      } else {
        outcomes.push({ state: "error", note: failure || "Asana task was not created." });
      }
      if (!docs) {
        outcomes.push({ state: "skipped", note: "Not run" });
      } else {
        const found = docs.documents || {};
        const subs = [];
        let count = 0;
        for (const [key, label] of KINDS) {
          const item = found[key] || { status: "missing" };
          const paths = item.path ? [item.path] : item.paths || [];
          const titles = item.title ? [item.title] : item.titles || [];
          if (item.status !== "found" || !paths.length) {
            subs.push({ ok: false, label: label + " — " + (item.status || "missing") });
            continue;
          }
          paths.forEach((path, index) => {
            count += 1;
            const title = titles[index] || label;
            subs.push({ ok: true, label: title, open: () => ({ title, path }) });
          });
        }
        outcomes.push(
          count
            ? { state: "done", note: count + " document" + (count === 1 ? "" : "s") + " found", subs }
            : { state: "error", note: docs.error_message || "No documents were retrieved.", subs }
        );
      }
      const sp = docs && docs.sharepoint;
      if (!sp) outcomes.push({ state: "skipped", note: "Not run" });
      else if (sp.status === "uploaded") {
        outcomes.push({
          state: "done",
          note: sp.folder || "",
          subs: Object.keys(sp.files || {}).map((name) => ({ ok: true, label: name, url: sp.files[name] })),
          url: sp.folder_url,
          urlText: "Open SharePoint folder",
        });
      } else if (sp.status === "skipped") outcomes.push({ state: "skipped", note: sp.reason || "Skipped" });
      else outcomes.push({ state: "error", note: sp.error_message || "Upload failed." });
      return outcomes;
    }

    function quoteOutcomes(result, payload) {
      const records = payload.records || [];
      const outcomes = [];
      outcomes.push(
        records.length
          ? {
              state: "done",
              note: (payload.record_count ?? records.length) + " lines",
              open: () => ({ title: "Quote lines " + (payload.quote_number || ""), records }),
            }
          : { state: "error", note: errorText(result.data) || "No quote lines were returned." }
      );
      outcomes.push(
        payload.screenshot_path
          ? {
              state: "done",
              note: payload.screenshot_taken_at || "",
              open: () => ({
                title: "Screenshot " + (payload.screenshot_taken_at || ""),
                ...(payload.screenshot_png_base64
                  ? { image: "data:image/png;base64," + payload.screenshot_png_base64 }
                  : { path: payload.screenshot_path }),
              }),
            }
          : { state: "error", note: errorText(result.data) || "Screenshot failed." }
      );
      const drs = payload.drs;
      if (!drs) outcomes.push({ state: "skipped", note: "Not run" });
      else if (drs.status === "created" || drs.status === "updated") {
        outcomes.push({
          state: "done",
          note: "Sheet " + drs.status + ": " + (drs.file || ""),
          url: drs.url,
          urlText: "Open Deal Review Sheet",
        });
      } else if (drs.status === "skipped") outcomes.push({ state: "skipped", note: drs.reason || "Skipped" });
      else outcomes.push({ state: "error", note: drs.error_message || "Sheet update failed." });
      return outcomes;
    }

    buildFlow(document.getElementById("ack-flow"), ACK_STEPS);
    buildFlow(document.getElementById("quote-flow"), QUOTE_STEPS);

    async function post(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, data };
    }

    document.getElementById("ack-fill").addEventListener("click", () => {
      document.getElementById("subject").value = "Test - Purchase Acknowledgement for SailPoint Offerings";
      document.getElementById("body").value = [
        "Hello,",
        "",
        "This is a purchase acknowledgement for the Test account.",
        "The signed quote is Q-127182. The purchase order, transaction approval form, and master agreement are attached.",
        "",
        "Regards,",
        "SailPoint Revenue Operations",
      ].join("\n");
    });

    async function runFlow({ button, status, container, titles, delays, call, outcomesFor }) {
      button.disabled = true;
      status.textContent = "";
      const steps = buildFlow(container, titles);
      const stop = startProgress(steps, delays);
      try {
        const result = await call();
        stop();
        await settleFlow(steps, outcomesFor(result, payloadOf(result.data)));
        status.textContent = result.ok ? "" : errorText(result.data) || "Request failed.";
      } catch (error) {
        stop();
        await settleFlow(
          steps,
          steps.map((_, index) => (index === 0 ? { state: "error", note: String(error) } : { state: "skipped", note: "Not run" }))
        );
        status.textContent = String(error);
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("ack-button").addEventListener("click", () =>
      runFlow({
        button: document.getElementById("ack-button"),
        status: document.getElementById("ack-status"),
        container: document.getElementById("ack-flow"),
        titles: ACK_STEPS,
        delays: ACK_DELAYS,
        call: () => post(API + "/purchase-acknowledge", {
          subject: document.getElementById("subject").value,
          body: document.getElementById("body").value,
        }),
        outcomesFor: ackOutcomes,
      })
    );

    document.getElementById("quote-button").addEventListener("click", () =>
      runFlow({
        button: document.getElementById("quote-button"),
        status: document.getElementById("quote-status"),
        container: document.getElementById("quote-flow"),
        titles: QUOTE_STEPS,
        delays: QUOTE_DELAYS,
        call: () => post(API + "/quote-lines-drs", { quote_number: document.getElementById("quote").value.trim() }),
        outcomesFor: quoteOutcomes,
      })
    );

    document.getElementById("viewer-prev").addEventListener("click", () => stepViewer(-1));
    document.getElementById("viewer-next").addEventListener("click", () => stepViewer(1));
    document.getElementById("viewer-close").addEventListener("click", closeViewer);
    document.getElementById("viewer").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeViewer();
    });
    document.addEventListener("keydown", (event) => {
      if (document.getElementById("viewer").hidden) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeViewer();
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        stepViewer(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        stepViewer(1);
      }
    });
  </script>
</body>
</html>
